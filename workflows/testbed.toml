# Testbed Instance Configuration
#
# [testbed] section: required, defines the testbed instance context
#
# Override sections: Any section matching a workflow config section will override
# those values. Section names are descriptive (e.g., [daq_state_machine],
# [fast_processing]) so overrides are unambiguous.

[testbed]
# Namespace for this testbed instance.
# Must be set before running workflows - empty string will cause an error.
# Examples: "epic-fastmon-dev", "collab-dec29", "wenauseic-test1"
#
# Multiple users can collaborate in one namespace.
# Users are responsible for namespace uniqueness.
namespace = "torre1"

# Example: Override fast_processing settings for this testbed
# [fast_processing]
# stf_count = 5                   # Fewer STF files for quick testing
#
# Example: Override daq_state_machine timing for this testbed
# [daq_state_machine]
# stf_interval = 1.0              # Faster STF generation

# =============================================================================
# Agent Configuration
# =============================================================================
# Agents managed by supervisord. Enable the ones needed for your workflow.
# Scripts are relative to swf-testbed root.

[agents.data]
enabled = false
script = "example_agents/example_data_agent.py"

[agents.processing]
enabled = true
script = "example_agents/example_processing_agent.py"

[agents.fastmon]
enabled = false
script = "example_agents/example_fastmon_agent.py"

[agents.fast_processing]
enabled = false
script = "example_agents/fast_processing_agent.py"

# =============================================================================
# Workflow Configuration (for testbed run command)
# =============================================================================

[workflow]
# Default workflow to run with 'testbed run'
name = "stf_datataking"
config = "fast_processing_default"
realtime = true

version = "1.0"
description = "STF datataking workflow for fast processing"
# includes = ["daq_state_machine.toml"]
includes = ["daq_state_machine_panda_test.toml"]

# Optional parameter overrides
# [parameters]
# stf_count = 5
# physics_period_count = 2

[fast_processing]
# If the workflow doesn't define these parameters, the Fast processing agent will load parameters from here.
# Count-based STF generation
stf_count = 10                  # Generate exactly 10 STF files
physics_period_count = 1        # Single physics period

# Fast processing parameters
target_worker_count = 30        # Target number of workers for processing
memory_per_core = 6000          # Memory per core
stf_sampling_rate = 1.0         # Fraction of STF data sampled by FastMon (100% for testing)
slice_processing_time = 30      # Time to process one slice (seconds)
worker_rampup_time = 300        # Time to bring workers online (seconds, 5 min)
worker_rampdown_time = 60       # Time for graceful worker shutdown (seconds)

# FastMon agent parameters
# selection_fraction = 0.1        # Fraction of STF files to sample (10%), it's stf_sampling_rate
tf_files_per_stf = 7            # Number of TF files to generate per STF
tf_size_fraction = 0.15         # Fraction of partition TF count per subsample (with gaussian noise)
tf_count_per_stf = 1000         # Default total TF count per STF if not provided in stf_ready message
tf_sequence_start = 1           # Starting sequence number for TF files
no_duplicate_mode = false        # Set true to skip notification for already-registered TF files
run_id_lifetime = 2             # Days to keep run_id in runs_sampled cache
slices_per_sample = 5          # Number of TF slices per STF sample
dest_path = '/gpfs02/eic/panda/jobs/'  # output destination path
# epic_version = "26.03.0"
# epic_image = "/cvmfs/singularity.opensciencegrid.org/eicweb/eic_xl:26.06.0-stable"
epic_version = "26.07.0"
epic_image = "/cvmfs/singularity.opensciencegrid.org/eicweb/eic_xl:26.07.0-stable"

processor_type = "zeromq"        # none or zeromq

[ejfat]
# admin_uri = "ejfat://token@host:port/lb/1?..."
admin_uri = "ejfats://****@ejfat-lb.es.net:18040/lb/68?sync=192.188.29.6:19042&data=192.188.29.42&data=[2001:400:a300::42]"
data_id = 1
event_src_id = 1
event_size_bytes = 1024